<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrocontrol | Portal y Administración</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f2;color:#263326}
header{background:#fff;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{height:85px;max-width:270px;object-fit:contain}
.container{max-width:1100px;margin:35px auto;padding:20px}
.menu{display:flex;gap:20px;justify-content:center;margin-bottom:30px}
.menu button{border:0;background:#2e6b3d;color:#fff;padding:16px 30px;border-radius:10px;font-size:17px;cursor:pointer}
.menu button:hover{background:#245631}
.panel{display:none;background:#fff;padding:30px;border-radius:14px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.panel.active{display:block}
h2{color:#2e6b3d;margin-top:0}h3{color:#3d6546}
input,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccd5cc;border-radius:8px;font-size:15px}
button.action{background:#2e6b3d;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:15px}
button.action:hover{background:#245631}
hr{border:0;border-top:1px solid #ddd;margin:30px 0}
.card{background:#f7faf6;padding:20px;border-radius:12px;margin-top:20px}
.progress{height:18px;background:#dfe7df;border-radius:20px;overflow:hidden;margin:12px 0}
.progress-bar{height:100%;background:#4c9a5d;width:0}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border-bottom:1px solid #ddd;padding:12px 8px;text-align:left}
th{background:#eef4ed;color:#2e6b3d}
.success{color:#2e7d32;font-weight:bold}.warning{color:#b36b00;font-weight:bold}
.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin-top:20px}
.section-card{background:#fff;border:1px solid #dbe6da;border-radius:12px;padding:22px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.section-card strong{display:block;color:#2e6b3d;font-size:18px;margin-bottom:9px}
.section-card .icon{font-size:32px;margin-bottom:8px}
.small{color:#6d766d;font-size:13px}
footer{text-align:center;padding:25px;color:#777;font-size:13px}
@media(max-width:700px){header{justify-content:center}.logo{height:75px;max-width:230px}.menu{flex-direction:column}}
</style>
</head>

<div class="container">
  <div class="menu">
    <button onclick="show('cliente')">Portal Cliente</button>
    <button onclick="show('admin')">Administración</button>
  </div>

  <div id="cliente" class="panel">
    <h2>Portal Cliente</h2>
    <p>Ingresá tu código de cliente:</p>
    <input id="codigoCliente" type="text" placeholder="Ejemplo: JP-001">
    <button class="action" onclick="buscarCliente()">Ingresar</button>
    <div id="clienteResultado"></div>
  </div>

  <div id="admin" class="panel">
    <h2>Panel de Administración</h2>
    <p>Acá vas a poder gestionar clientes y sumar hectáreas.</p>

    <div class="card">
      <h3>Agregar nuevo cliente</h3>
      <label>Nombre del cliente</label>
      <input id="nuevoNombre" type="text" placeholder="Ejemplo: Juan Pérez">
      <label>Código</label>
      <input id="nuevoCodigo" type="text" placeholder="Ejemplo: JP-001">
      <label>Hectáreas iniciales</label>
      <input id="nuevasHa" type="number" min="0" step="0.1" placeholder="Ejemplo: 420">
      <button class="action" onclick="agregarCliente()">➕ Cargar cliente</button>
    </div>

    <hr>

    <div class="card">
      <h3>Sumar hectáreas a un cliente</h3>
      <label>Cliente</label>
      <select id="clienteSelect"></select>
      <label>Hectáreas a sumar</label>
      <input id="haSumar" type="number" min="0" step="0.1" placeholder="Ejemplo: 50">
      <button class="action" onclick="sumarHa()">Cargar</button>
    </div>

    <div class="card">
      <h3>Clientes</h3>
      <table>
        <thead><tr><th>Cliente</th><th>Código</th><th>Ha</th><th>Progreso</th><th>Estado</th></tr></thead>
        <tbody id="tablaClientes"></tbody>
      </table>
    </div>
  </div>
</div>

<footer>Agrocontrol — Gestión agrícola</footer>

<script>
const iniciales=[
  {nombre:"Juan Pérez",codigo:"JP-001",ha:420},
  {nombre:"Cliente 2",codigo:"AC-002",ha:275},
  {nombre:"Cliente 3",codigo:"AC-003",ha:510}
];

let guardados=null;
try{guardados=JSON.parse(localStorage.getItem("agrocontrol_clientes")||"null")}catch(e){}
let clientes=Array.isArray(guardados)&&guardados.length?guardados:iniciales;

function guardar(){localStorage.setItem("agrocontrol_clientes",JSON.stringify(clientes))}

function show(id){
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="admin")render();
}

function render(){
  const s=document.getElementById("clienteSelect");
  const t=document.getElementById("tablaClientes");
  s.innerHTML=""; t.innerHTML="";
  clientes.forEach((c,i)=>{
    let o=document.createElement("option");
    o.value=i;o.textContent=c.nombre+" — "+c.codigo;s.appendChild(o);
    let p=Math.min(100,c.ha/5);
    let estado=c.ha>=500?'<span class="success">Objetivo cumplido</span>':'<span class="warning">En progreso</span>';
    t.innerHTML+=`<tr><td>${c.nombre}</td><td>${c.codigo}</td><td>${Number(c.ha).toFixed(1)} ha</td><td>${Math.round(p)}%</td><td>${estado}</td></tr>`;
  });
}

function agregarCliente(){
  let nombre=document.getElementById("nuevoNombre").value.trim();
  let codigo=document.getElementById("nuevoCodigo").value.trim().toUpperCase();
  let ha=Number(document.getElementById("nuevasHa").value);
  if(!nombre||!codigo){alert("Completá el nombre y el código.");return}
  if(!Number.isFinite(ha)||ha<0){alert("Ingresá una cantidad válida.");return}
  if(clientes.some(c=>c.codigo.toUpperCase()===codigo)){alert("Ese código ya existe.");return}
  clientes.push({nombre,codigo,ha});guardar();render();
  document.getElementById("nuevoNombre").value="";
  document.getElementById("nuevoCodigo").value="";
  document.getElementById("nuevasHa").value="";
  alert("Cliente cargado correctamente.");
}

function sumarHa(){
  let i=Number(document.getElementById("clienteSelect").value);
  let v=Number(document.getElementById("haSumar").value);
  if(!Number.isFinite(v)||v<=0){alert("Ingresá una cantidad válida.");return}
  if(!clientes[i])return;
  clientes[i].ha=Number(clientes[i].ha)+v;guardar();render();
  document.getElementById("haSumar").value="";
  alert("Hectáreas cargadas correctamente.");
}

function buscarCliente(){
  let codigo=document.getElementById("codigoCliente").value.trim().toUpperCase();
  let r=document.getElementById("clienteResultado");
  let c=clientes.find(x=>x.codigo.toUpperCase()===codigo);

  if(!c){
    r.innerHTML='<div class="card"><p class="warning">No encontramos un cliente con ese código.</p></div>';
    return;
  }

  let faltan=Math.max(0,500-c.ha);
  let p=Math.min(100,c.ha/5);

  r.innerHTML=`
    <div class="card">
      <h3>Hola, ${c.nombre}</h3>
      <p><strong>Hectáreas acumuladas:</strong> ${Number(c.ha).toFixed(1)} ha</p>
      <p><strong>Objetivo:</strong> 500 ha</p>
      <p><strong>Faltan:</strong> ${faltan.toFixed(1)} ha</p>
      <div class="progress"><div class="progress-bar" style="width:${p}%"></div></div>
      <p><strong>Progreso:</strong> ${Math.round(p)}%</p>
      <p><strong>Estado:</strong> ${c.ha>=500?'<span class="success">Objetivo cumplido</span>':'<span class="warning">En progreso</span>'}</p>

      <h3>Servicios e Insumos</h3>
      <div class="section-grid">
        <div class="section-card">
          <div class="icon">🚜</div>
          <strong>Servicios</strong>
          <span class="small">Servicios contratados y realizados</span>
        </div>
        <div class="section-card">
          <div class="icon">🧪</div>
          <strong>Insumos</strong>
          <span class="small">Insumos utilizados y disponibles</span>
        </div>
        <div class="section-card">
          <div class="icon">📍</div>
          <strong>Monitoreo</strong>
          <span class="small">Monitoreos del campo</span>
        </div>
        <div class="section-card">
          <div class="icon">🛰️</div>
          <strong>Aplicaciones</strong>
          <span class="small">Aplicaciones realizadas</span>
        </div>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
